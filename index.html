<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Force Light Theme and clear any past dark mode choices -->
    <script>
      (function () {
        try {
          localStorage.removeItem('theme');
          document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>

    <title>Navneet Patidar - UI/UX & Product Designer</title>

    <meta
      name="description"
      content="Navneet Patidar is a UI/UX & Product Designer crafting research-backed, accessible digital experiences. View case studies in fintech, e-commerce, and consumer apps."
    />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Navneet Patidar — UI/UX & Product Designer" />
    <meta property="og:description" content="Crafting digital experiences that blend meaningful aesthetics with performant engineering. Based in New Delhi, India." />
    <meta property="og:url" content="https://navneetpatidar.in" />
    <meta property="og:image" content="/portfolio-og.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Navneet Patidar — UI/UX & Product Designer" />
    <meta name="twitter:description" content="Crafting digital experiences that blend meaningful aesthetics with performant engineering." />
    <meta name="twitter:image" content="/portfolio-og.png" />

    <!-- Pinterest Domain Verification -->
    <meta name="p:domain_verify" content="495d09f3a45f12801435f0a0b5621113"/>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/portfolio-favicon.png" />

    <style>
      html {
        margin: 0;
      }
      body {
        min-height: 100%;
        margin: 0;
      }
      #root {
        min-height: 100%;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
